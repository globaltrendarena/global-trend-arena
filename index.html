<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inaaya's Mart - Global Premium Store</title>
    <meta name="description" content="Shop the latest global trends with fast shipping and secure checkout at Inaaya's Mart.">

    <!-- Preconnect for External CDNs -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- FontAwesome Non-blocking CSS Load -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

    <!-- External JS Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase-client.js" defer></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* App Root Container */
        #app-root { max-width: 1200px; margin: 25px auto; padding: 0 15px; min-height: 65vh; width: 100%; flex: 1; }
        .loading-state { text-align: center; padding: 60px 20px; }
        .loading-state i { font-size: 2rem; color: #0284c7; }
        .loading-state p { margin-top: 15px; color: #64748b; font-weight: 500; }
    </style>
</head>
<body>

    <!-- হেডার কম্পোনেন্ট ডায়নামিকালি এখানে লোড হবে -->
    <div id="header-container"></div>

    <!-- মূল পেজের কনটেন্ট এখানে লোড হবে -->
    <main id="app-root">
        <div class="loading-state">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <p>Loading Inaaya's Mart Environment...</p>
        </div>
    </main>

    <!-- ফুটার কম্পোনেন্ট ডায়নামিকালি এখানে লোড হবে -->
    <div id="footer-container"></div>

    <script>
        let storeConfig = null;

        // কম্পোনেন্ট ফেচ করে ইনজেক্ট করার ফাংশন
        async function loadComponent(containerId, filePath) {
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    document.getElementById(containerId).innerHTML = await response.text();
                } else {
                    console.error(`Failed to load component: ${filePath}`);
                }
            } catch (error) {
                console.error(`Error loading ${filePath}:`, error);
            }
        }

        // ওয়ার্ডপ্রেসের মতো ইউআরএলের শেষে ট্রেইলিং স্ল্যাশ (/) হ্যান্ডেল করা
        function getCleanUrlPath(filePath) {
            let clean = filePath.replace('pages/', '').replace('.html', '');
            return clean === 'home' ? '/' : `/${clean}/`;
        }

        async function initStore() {
            try {
                // ১. আলাদা ফাইল থেকে হেডার ও ফুটার লোড করা
                await loadComponent('header-container', 'components/header.html');
                await loadComponent('footer-container', 'components/footer.html');

                // ২. কনফিগ ফাইল থেকে নেভিগেশন মেনু তৈরি করা
                const res = await fetch('config.json');
                storeConfig = await res.json();
                const nav = document.getElementById('main-nav');
                
                if (nav && storeConfig.storefront_routes && Array.isArray(storeConfig.storefront_routes)) {
                    nav.innerHTML = '';
                    storeConfig.storefront_routes.filter(r => r.in_menu).forEach(route => {
                        const cleanUrl = getCleanUrlPath(route.path);
                        const a = document.createElement('a');
                        a.innerText = route.title;
                        a.href = cleanUrl;
                        a.dataset.path = cleanUrl;
                        a.onclick = (e) => {
                            e.preventDefault();
                            navigateTo(cleanUrl, route.path, route.title);
                        };
                        nav.appendChild(a);
                    });
                }

                updateCartCount();
                handlePopState();
            } catch (err) {
                console.error("Config initialization error:", err);
                document.getElementById('app-root').innerHTML = '<h2 style="text-align:center; padding:50px;">Store Configuration Error</h2>';
            }
        }

        function navigateTo(cleanUrl, htmlPath, title) {
            window.history.pushState({ cleanUrl, htmlPath, title }, '', cleanUrl);
            setActiveNav(cleanUrl);
            loadPage(htmlPath, title);
        }

        function handlePopState() {
            const currentPath = window.location.pathname.replace(/\/$/, "");
            let targetRoute = storeConfig?.storefront_routes?.find(r => {
                let routeClean = getCleanUrlPath(r.path).replace(/\/$/, "");
                return routeClean === currentPath || (currentPath === "" && routeClean === "");
            });
            
            let htmlPath = targetRoute ? targetRoute.path : (window.location.pathname === '/' ? 'pages/home.html' : `pages${window.location.pathname.replace(/\//g, '')}.html`);
            let title = targetRoute ? targetRoute.title : 'Store';

            setActiveNav(window.location.pathname);
            loadPage(htmlPath, title);
        }

        function setActiveNav(cleanUrl) {
            const normalizedUrl = cleanUrl.replace(/\/$/, "") || "/";
            document.querySelectorAll('#main-nav a').forEach(el => {
                let elPath = el.dataset.path.replace(/\/$/, "") || "/";
                if (elPath === normalizedUrl || (normalizedUrl === "/" && (elPath === "/home" || elPath === "/"))) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        async function loadPage(path, title = null) {
            const root = document.getElementById('app-root');
            try {
                const res = await fetch(path);
                if (!res.ok) throw new Error("Module not found");
                
                const html = await res.text();
                root.innerHTML = html;

                if (title) {
                    document.title = `${title} - Inaaya's Mart`;
                }

                // পেজের ভেতরের স্ক্রিপ্টগুলো এক্সিকিউট করার ব্যবস্থা
                root.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    oldScript.replaceWith(newScript);
                });

                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch (err) {
                root.innerHTML = '<div style="text-align:center; padding:50px;"><h2>Module coming soon...</h2></div>';
            }
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const badge = document.getElementById('cart-count');
            if (badge) badge.innerText = cart.length;
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                if (query) {
                    navigateTo(`/search/?q=${encodeURIComponent(query)}`, 'pages/search.html', 'Search');
                }
            }
        }

        window.addEventListener('popstate', handlePopState);
        document.addEventListener('DOMContentLoaded', initStore);
    </script>
</body>
</html>

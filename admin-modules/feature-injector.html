<h2>Add Dynamic Feature Module</h2>
<p style="margin-top:5px; color:#94a3b8;">Use this form to register new HTML files directly into config.json.</p>
<div style="margin-top:20px; background:#1e293b; padding:20px; border-radius:8px; border:1px solid #334155; max-width:500px;">
    <label style="display:block; margin-bottom:5px;">Module/Page Title</label>
    <input type="text" placeholder="e.g. AI Copywriter" style="width:100%; padding:10px; margin-bottom:15px; border-radius:4px; border:1px solid #334155; background:#0f172a; color:#fff;">

    <label style="display:block; margin-bottom:5px;">File Path</label>
    <input type="text" placeholder="e.g. admin-modules/ai-writer.html" style="width:100%; padding:10px; margin-bottom:15px; border-radius:4px; border:1px solid #334155; background:#0f172a; color:#fff;">

    <button style="background:#0284c7; color:#fff; padding:10px 20px; border:none; border-radius:4px; cursor:pointer;">Register New Module</button>
</div>

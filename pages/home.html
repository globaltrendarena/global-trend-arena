<!-- pages/home.html -->
<style>
    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }
    .product-card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        transition: transform 0.2s ease;
    }
    .product-card:hover {
        transform: translateY(-4px);
    }
    .product-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 6px;
    }
    .product-title {
        font-weight: 600;
        margin: 10px 0 5px;
        color: #0f172a;
    }
    .product-price {
        color: #0284c7;
        font-weight: 700;
        font-size: 1.1rem;
    }
</style>

<h2 style="font-size: 1.5rem; color: #0f172a; margin-bottom: 10px;">Trending Products</h2>

<div class="product-grid" id="product-container">
    <!-- Dynamic Products will load here -->
    <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; color: #0284c7;"></i>
        <p style="margin-top: 10px; color: #64748b;">Fetching latest items...</p>
    </div>
</div>

<script>
    // Fetch products from Supabase or Static JSON
    async function loadHomeProducts() {
        const container = document.getElementById('product-container');
        try {
            // Example product render logic
            if (window.supabaseClient) {
                const { data: products, error } = await supabaseClient.from('products').select('*');
                if (products && products.length > 0) {
                    container.innerHTML = products.map(p => `
                        <div class="product-card">
                            <img src="${p.image_url || 'https://via.placeholder.com/300'}" alt="${p.title}" loading="lazy" width="300" height="200">
                            <div class="product-title">${p.title}</div>
                            <div class="product-price">$${p.price}</div>
                        </div>
                    `).join('');
                    return;
                }
            }
            // Fallback if no database connected yet
            container.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">No products found in store.</p>';
        } catch (err) {
            console.error("Error loading products:", err);
            container.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Failed to load products.</p>';
        }
    }

    loadHomeProducts();
</script>

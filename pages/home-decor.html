<h2 style="font-size: 1.5rem; color: #0f172a; margin-bottom: 10px;">Home Decor Products</h2>

<div class="product-grid" id="home-decor-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 20px;">
    <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
        <i class="fa-solid fa-spin fa-spinner" style="font-size: 1.5rem; color: #0284c7;"></i>
        <p style="margin-top: 10px; color: #64748b;">Loading Home Decor items...</p>
    </div>
</div>

<script>
    async function loadHomeDecor() {
        const container = document.getElementById('home-decor-container');
        try {
            if (window.supabaseClient) {
                const { data } = await supabaseClient.from('products').select('*').eq('category', 'Home Decor');
                if (data && data.length > 0) {
                    container.innerHTML = data.map(p => `
                        <div class="product-card" style="background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:15px; text-align:center;">
                            <img src="${p.image_url || 'https://via.placeholder.com/300'}" alt="${p.title}" loading="lazy" style="width:100%; height:200px; object-fit:cover; border-radius:6px;">
                            <div style="font-weight:600; margin:10px 0 5px; color:#0f172a;">${p.title}</div>
                            <div style="color:#0284c7; font-weight:700;">$${p.price}</div>
                        </div>
                    `).join('');
                    return;
                }
            }
            container.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">No products available in Home Decor.</p>';
        } catch (err) {
            container.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Error loading products.</p>';
        }
    }
    loadHomeDecor();
</script>
